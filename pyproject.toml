[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftwatch"
version = "0.1.0"
description = "AI-powered schema drift detection for lakehouse tables"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DriftWatch Contributors" }]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "pyarrow",
    "faker",
    "pyiceberg[sql-sqlite]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]

# Tell hatchling where the package lives (src/ layout).
[tool.hatch.build.targets.wheel]
packages = ["src/driftwatch"]

[tool.pytest.ini_options]
# Make `import driftwatch` resolve without an install when running tests locally.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/driftwatch", "scripts"]
# Allow sibling imports between demo scripts (e.g. seed_iceberg_data -> seed_demo_data).
mypy_path = ["scripts"]

# pyarrow, faker, and pyiceberg ship incomplete/no stubs; ignore missing imports.
[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "faker",
    "faker.*",
    "pyiceberg",
    "pyiceberg.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Reasonable production defaults: pycodestyle, pyflakes, isort, bugbear, upgrades.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["driftwatch"]
